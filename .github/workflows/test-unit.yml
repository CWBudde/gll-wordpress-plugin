name: Unit tests

on:
    workflow_call:

permissions:
    contents: read

jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # --ci makes Jest fail on a missing snapshot rather than writing one.
            # Coverage is collected for the unit project only: the integration
            # project's reach depends on whether the reference corpus is present,
            # which would make the number differ between a laptop and a runner.
            - name: Run unit tests
              run: npm run test:unit -- --ci --maxWorkers=2 --coverage

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage/lcov.info
                  if-no-files-found: ignore
