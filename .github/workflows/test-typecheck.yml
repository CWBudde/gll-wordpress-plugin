name: Typecheck

on:
    workflow_call:

permissions:
    contents: read

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # wp-scripts compiles through babel, which strips types without
            # checking them — so without this job a genuine type error builds
            # clean and ships.
            - name: Typecheck
              run: npm run typecheck
