name: End-to-end tests

on:
    workflow_call:

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Only Chromium. Firefox and WebKit are configured in
            # playwright.config.ts and can be run locally, but headless WebGL on
            # Linux is unreliable in both, and the specs that do not need WebGL
            # duplicate what the jsdom suite already covers. Adding them here
            # would buy flakes rather than coverage.
            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Start wp-env
              run: npx wp-env start --update

            - name: Run the end-to-end tests
              run: npm run test:e2e -- --project=chromium

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-artifacts
                  path: tests/e2e/artifacts/
                  retention-days: 7
