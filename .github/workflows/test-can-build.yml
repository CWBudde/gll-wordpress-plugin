name: Can Build

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Deliberately does NOT assert that the committed build/ matches
            # this output. build/ is tracked and rebuilt by hand as a `build:`
            # commit, so a stale bundle is a real hazard — but webpack output is
            # not reproducible across Node minor versions, and a check that goes
            # red for version skew on ordinary pushes trains people to ignore a
            # red X. release.yml runs `git diff --exit-code -- build/` on a tag
            # instead, which is the only moment a stale bundle can actually
            # reach a user.
            - name: Build
              run: npm run build
